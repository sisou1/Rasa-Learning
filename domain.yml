version: "3.1"

intents:
  - salutation
  - au_revoir
  - affirmation
  - negation
  - humeur_bonne
  - humeur_mauvaise
  - reservation_hotel
  - donner_destination
  - donner_date

responses:
  utter_salutation:
    - text: "Bonjour ! Comment vas-tu ?"
  
  utter_au_revoir:
    - text: "Au revoir ! Passe une bonne journée !"

  utter_heureux:
    - text: "Super, content de l'entendre ! 😊"

  utter_reconfort:
    - text: "Oh, désolé d'entendre ça. Qu'est-ce qui ne va pas ? 😟"

  utter_aide:
    - text: "J'espère que ça ira mieux bientôt. Tu veux en parler ?"

  utter_demande_destination:
    - text: "Où souhaitez-vous réserver un hôtel ?"

  utter_demande_date:
    - text: "Pour quelle date souhaitez-vous réserver votre hôtel ?"

  utter_confirmation_reservation:
    - text: "Vous voulez prendre un hôtel à {destination} le {date_sejour}, c'est bien cela ?"

entities:
  - destination
  - date

slots:
  destination:
    type: text
    mappings:
      - type: from_entity
        entity: destination

  date_sejour:
    type: text
    mappings:
      - type: from_entity
        entity: date

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
