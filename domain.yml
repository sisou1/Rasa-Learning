version: "3.1"


intents:
  - salutation
  - au_revoir
  - affirmation
  - negation
  - demander_allergenes
  - demander_menu_du_jour
  - start_reservation
  - date_reservation
  - nombre_personne
  - nom_reservation
  - numero_de_telephone
  - annuler_reservation
  - voir_reservation
  - code_reservation

entities:
  - date
  - nombre
  - nom
  - telephone
  - commentaire
  - code_reservation

slots:
  nom_reservation:
    type: text
    mappings:
      - type: from_entity
        entity: nom
  numero_de_telephone:
    type: text
    mappings:
      - type: from_entity
        entity: telephone
  nombre_personne:
    type: text
    mappings:
      - type: from_entity
        entity: nombre
  date_reservation:
    type: text
    mappings:
      - type: from_entity
        entity: date
  commentaire:
    type: text
    mappings:
      - type: from_entity
        entity: commentaire
  code_reservation:
    type: text
    mappings:
      - type: from_entity
        entity: code_reservation


responses:
  utter_salutation:
    - text: "Bonjour ! Comment vas-tu ?"
  
  utter_au_revoir:
    - text: "Au revoir ! Passe une bonne journée !"

  utter_demande_date:
    - text: "Pour quelle date souhaitez-vous réserver ?"

  utter_demande_nombre:
    - text: "Combien de personnes seront présentes ?"

  utter_demande_nom:
    - text: "Quel est votre nom de famille ?"

  utter_demande_num:
    - text: "Quel est votre numéro de téléphone ?"
  
  utter_non:
    - text: "huh ?"

  utter_demande_code:
    - text: "Quel est votre code de réservation ?"

actions:
  - action_obtenir_allergenes
  - action_obtenir_menu_du_jour
  - action_verification
  - action_reservation
  - action_annuler_reservation
  - action_afficher_reservation


session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true