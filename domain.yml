version: "3.1"


intents:
  - salutation
  - au_revoir
  - affirmation
  - negation
  - demander_allergenes
  - demander_menu_du_jour
  - start_reservation
  - date_reservation
  - nombre_personne
  - nom_reservation
  - numero_de_telephone
  - annuler_reservation
  - modifier_reservation

entities:
  - date
  - nombre
  - nom
  - telephone
  - commentaire
  - code_reservation

slots:
  nom_reservation:
    type: text
    mappings:
      - type: from_entity
        entity: nom
  numero_de_telephone:
    type: text
    mappings:
      - type: from_entity
        entity: telephone
  nombre_personne:
    type: text
    mappings:
      - type: from_entity
        entity: nombre
  date_reservation:
    type: text
    mappings:
      - type: from_entity
        entity: date
  commentaire:
    type: text
    mappings:
      - type: from_entity
        entity: commentaire
  code_reservation:
    type: text
    mappings:
      - type: from_entity
        entity: code_reservation


responses:
  utter_salutation:
    - text: "Bonjour ! Comment vas-tu ?"
  
  utter_au_revoir:
    - text: "Au revoir ! Passe une bonne journée !"

  utter_demande_date:
    - text: "Pour quelle date souhaitez-vous réserver ?"

  utter_demande_nombre:
    - text: "Combien de personnes seront présentes ?"

  utter_demande_nom:
    - text: "Quel est votre nom ?"

  utter_demande_num:
    - text: "Quel est votre numéro de téléphone ?"

  utter_code_reservation:
    - text: "Votre code de réservation est : {booking_number}"

  utter_annulation_confirmation:
    - text: "Votre réservation a bien été annulée."

  utter_modification_confirmation:
    - text: "Votre réservation a bien été modifiée."

actions:
  - action_obtenir_allergenes
  - action_obtenir_menu_du_jour
  - action_verification
  - action_reservation
  - action_annuler_reservation
  - action_modifier_reservation
