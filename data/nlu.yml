version: "3.1"

nlu:
- intent: salutation
  examples: |
    - salut
    - bonjour
    - coucou
    - hello
    - hey
    - bonsoir
    - salut tout le monde
    - salut toi
    - yo
    - bonne matinée
    - bonne soirée
    - bonne après-midi

- intent: au_revoir
  examples: |
    - au revoir
    - à plus
    - à bientôt
    - bye
    - à la prochaine
    - bonne journée
    - bonne soirée
    - à plus tard

- intent: affirmation
  examples: |
    - oui
    - ouais
    - bien sûr
    - exactement
    - c'est vrai
    - tout à fait

- intent: negation
  examples: |
    - non
    - pas du tout
    - jamais
    - je ne pense pas
    - pas vraiment
    - absolument pas

- intent: demander_allergenes
  examples: |
    - Quels sont les allergènes ?
    - Montre-moi la liste des allergènes
    - Quels sont les allergènes disponibles ?
    - J'ai besoin des allergènes
    - Peux-tu me donner la liste des allergènes ?

- intent: demander_menu_du_jour
  examples: |
    - Quel est le menu du jour ?
    - Peux-tu me dire ce qu'il y a au menu aujourd'hui ?
    - Montre-moi le menu du jour
    - Quel est le plat du jour ?