version: "3.1"

rules:
  - rule: Dire au revoir lorsque l'utilisateur dit au revoir
    steps:
      - intent: au_revoir
      - action: utter_au_revoir

  - rule: Dire les allergènes lorsque l'utilisateur les demande
    steps:
      - intent: demander_allergenes
      - action: action_obtenir_allergenes

  - rule: Dire le menu du jour lorsque l'utilisateur le demande
    steps:
      - intent: demander_menu_du_jour
      - action: action_obtenir_menu_du_jour
