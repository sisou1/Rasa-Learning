version: "3.1"

stories:
  - story: Demander au revoir
    steps:
      - intent: au_revoir
      - action: utter_au_revoir

  - story: Faire une réservation
    steps:
      - intent: salutation
      - action: utter_salutation
      - intent: start_reservation
      - action: utter_demande_date
      - intent: date_reservation
      - action: utter_demande_nombre
      - intent: nombre_personne
      - action: action_verification
      - intent: affirmation
      - action: utter_demande_nom
      - intent: nom_reservation
      - action: utter_demande_num
      - intent: numero_de_telephone
      - action: action_reservation
      - action: utter_code_reservation

  - story: Annuler une réservation
    steps:
      - intent: annuler_reservation
      - action: action_annuler_reservation

  - story: Modifier une réservation
    steps:
      - intent: modifier_reservation
      - action: action_modifier_reservation
